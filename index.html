<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MyQRMenu</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root { --brand: #d97706; --brand-dark: #b45309; }
body { -webkit-tap-highlight-color: transparent; transition: background 0.3s; }
.dark body { background: #0c0a09; color: #e7e5e4; }
.dark .bg-white { background: #1c1917 !important; }
.dark .bg-stone-50 { background: #0c0a09 !important; }
.dark .border-stone-200 { border-color: #292524 !important; }
.dark .text-stone-900 { color: #e7e5e4 !important; }
.dark .text-stone-500 { color: #a8a29e !important; }
.dark .text-stone-700 { color: #d6d3d1 !important; }
.dark .bg-stone-100 { background: #292524 !important; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.btn-brand { background: var(--brand); }
.text-brand { color: var(--brand); }
.bottom-tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,.06); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 40; }
.dark .bottom-tab-bar { background: rgba(28,25,23,.95); border-color: #292524; }
.tab-item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; flex: 1; position: relative; }
.tab-item.active .tab-label { color: var(--brand); font-weight: 800; }
.tab-item.active::after { content: ''; position: absolute; top: 0; width: 32px; height: 3px; background: var(--brand); }
</style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen">
<div id="root"><div class="p-10 text-center font-bold text-amber-600 text-xl">Loading MyQRMenu...</div></div>

<script>
window.onerror = function(msg, url, line, col, error) {
  document.getElementById('root').innerHTML = '<div style="padding:20px;text-align:center;"><h2 style="color:red;font-weight:bold;">⚠️ Error</h2><p style="font-weight:bold;">' + msg + '</p><p style="font-size:12px;color:gray;">Line: ' + line + '</p><button onclick="location.reload()" style="padding:10px 20px;background:#d97706;color:white;border:none;border-radius:5px;margin-top:10px;font-weight:bold;">Reload</button></div>';
  return false;
};
</script>

<!-- type="module" काढून टाकलाय आणि एरर चेकर लावलाय -->
<script src="./app.js" onerror="document.getElementById('root').innerHTML = '<div style=\'color:red; padding:20px; text-align:center; font-weight:bold; font-size:18px;\'>⚠️ app.js फाईल सापडत नाहीये!<br><br>कृपया तपासा की GitHub वर फाईलचे नाव अगदी <u>app.js</u> असेच आहे का.</div>'"></script>

</body>
</html>
